# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator"      # Project title
  author:       "Vedant817"      # GitHub username
  discord:      ""      # Optional
  description:  "Deterministic programmable protocol-emulator ASIC with 24-opcode ISA, on-chip serial bootloader with CRC-8 protection, bit-serial shifts, WAITEDGE autobaud capture, open-drain bus primitives, and formal PVFI trace port — 90+ protocol firmware programs verified across 509 tests"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000 # 10 MHz nominal target verified against synthesis critical path (<12ns)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x4"          # Jane Street competition maximum allocation

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_Vedant817_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "core.v"
    - "alu.v"
    - "gpio.v"
    - "program_ram.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.)
pinout:
  # Inputs (active-high active bootloader control and future expansion)
  ui[0]: "LOAD_REQ (bootloader load request)"
  ui[1]: "LOAD_DATA (bootloader serial data input)"
  ui[2]: "LOAD_CLK (bootloader serial clock input)"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs (bootloader status and reserved debug/trace)
  uo[0]: "BOOT_DONE (bootloader complete status)"
  uo[1]: "BOOT_ERR (bootloader CRC error / halt lock)"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins - the programmable protocol GPIO bus (GDIR/GWR/GRD instructions)
  uio[0]: "GPIO0 (protocol bus bit 0)"
  uio[1]: "GPIO1 (protocol bus bit 1)"
  uio[2]: "GPIO2 (protocol bus bit 2)"
  uio[3]: "GPIO3 (protocol bus bit 3)"
  uio[4]: "GPIO4 (protocol bus bit 4)"
  uio[5]: "GPIO5 (protocol bus bit 5)"
  uio[6]: "GPIO6 (protocol bus bit 6)"
  uio[7]: "GPIO7 (protocol bus bit 7)"

# Do not change!
yaml_version: 6
